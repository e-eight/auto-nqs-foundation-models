# ICRN settings for remote.py. Not edited by the agent.

hub_url = "https://jupyter.ncsa.illinois.edu"
user = "soham"
token_file = "~/.config/icrn/token"

# Server used for experiments: "" is the default server, anything else a named
# server (ICRN allows one default + one named per user). remote.py restarts this
# server if it is running without a GPU.
server = ""

# GitHub repo used to move code to ICRN, and paths on ICRN.
repo = "e-eight/auto-nqs-foundation-models"
gh = "~/.pixi/bin/gh"
remote_root = "~/auto-nqs"

# Spawn options, tried in order (H200 slice first, A100 slice as fallback).
# `user_options` is sent verbatim to the Hub. All three values ("1_cpu",
# "2_a100", "3_h200") were read from running sessions.
[[resources]]
gpu = "h200"
user_options = { profile = "environments", image = "python", resource = "3_h200" }

[[resources]]
gpu = "a100"
user_options = { profile = "environments", image = "python", resource = "2_a100" }

[timing]
spawn_wait = 300        # seconds to wait for one resource before trying the next
retry_wait = 300        # seconds to sleep when no GPU resource could be started
max_queue_wait = 7200   # give up after this long without a GPU server
run_timeout = 2700      # kill a run (sync + train + eval) after this many seconds
poll_every = 30
